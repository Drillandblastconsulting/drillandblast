<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drill and Blast Consulting</title>
  <meta name="description" content="Drill and Blast Consulting. Contact jessepage234@gmail.com">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --rock: #d8dcde;      /* page background */
      --ink: #1c2a31;       /* text */
      --marker: #f2b705;    /* survey-paint yellow */
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; margin: 0; }

    body {
      background-color: var(--rock);
      /* A staggered grid of small dots, like a drill pattern on a bench face */
      background-image: radial-gradient(circle, rgba(28, 42, 49, 0.28) 3px, transparent 3.5px);
      background-size: 44px 44px;
      color: var(--ink);
      font-family: "Barlow", Arial, sans-serif;
      font-size: 1.125rem;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 2rem 6vw;
    }

    main {
      background: var(--rock);
      max-width: 40rem;
      padding: 2.5rem 0 2.5rem 1.75rem;
      border-left: 12px solid var(--marker);
    }

    h1 {
      font-family: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
      font-weight: 800;
      font-size: clamp(3.5rem, 13vw, 8rem);
      line-height: 0.92;
      letter-spacing: -0.01em;
      margin: 0 0 1.75rem;
      text-transform: none;
    }

    p { margin: 0; }

    a {
      color: var(--ink);
      font-weight: 500;
      text-decoration-thickness: 3px;
      text-underline-offset: 5px;
      text-decoration-color: var(--marker);
    }

    a:hover { background: var(--marker); }

    a:focus-visible {
      outline: 3px solid var(--ink);
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Drill and Blast Consulting</h1>
    <p>Email <a href="mailto:jessepage234@gmail.com">jessepage234@gmail.com</a></p>
  </main>
</body>
</html>
